<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violet Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f4effc;
  --surface: #ffffff;
  --ink: #241538;
  --muted: #7a6a94;
  --brand: #6d28d9;
  --brand-ink: #ffffff;
  --brand-deep: #4c1d95;
  --bot-bubble: #ffffff;
  --bot-ink: #241538;
  --border: #ddd0f2;
  --focus: #a78bfa;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150d24;
    --surface: #21153a;
    --ink: #f1eafd;
    --muted: #a595c4;
    --brand: #8b5cf6;
    --brand-ink: #ffffff;
    --brand-deep: #2e1065;
    --bot-bubble: #2b1d4a;
    --bot-ink: #f1eafd;
    --border: #3a2a5e;
    --focus: #c4b5fd;
  }
}
:root[data-theme="dark"] {
  --bg: #150d24;
  --surface: #21153a;
  --ink: #f1eafd;
  --muted: #a595c4;
  --brand: #8b5cf6;
  --brand-ink: #ffffff;
  --brand-deep: #2e1065;
  --bot-bubble: #2b1d4a;
  --bot-ink: #f1eafd;
  --border: #3a2a5e;
  --focus: #c4b5fd;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
}
.app {
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--brand-deep);
  color: #fff;
}
.avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--brand);
  display: grid; place-items: center;
  font-weight: 700;
}
header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
header p { margin: 0; font-size: .8rem; opacity: .75; }
#log {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
}
.msg {
  max-width: 82%;
  padding: 10px 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.msg.bot {
  align-self: flex-start;
  background: var(--bot-bubble);
  color: var(--bot-ink);
  border: 1px solid var(--border);
  border-radius: 4px 18px 18px 18px;
}
.msg.me {
  align-self: flex-end;
  background: var(--brand);
  color: var(--brand-ink);
  border-radius: 18px 4px 18px 18px;
}
.typing { display: flex; gap: 5px; padding: 14px; }
.typing i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
  animation: blink 1s infinite;
}
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .typing i { animation: none; opacity: .6; }
  #log { scroll-behavior: auto; }
}
form { margin: 0; }
.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px 12px 12px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
textarea {
  flex: 1;
  resize: none;
  max-height: 140px;
  padding: 11px 14px;
  font: inherit;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  outline: none;
}
textarea::placeholder { color: var(--muted); }
textarea:focus-visible, button:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
button {
  height: 44px;
  padding: 0 20px;
  font: inherit;
  font-weight: 700;
  color: var(--brand-ink);
  background: var(--brand);
  border: 0;
  border-radius: 22px;
  cursor: pointer;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">V</div>
    <div>
      <h1>Violet Chat</h1>
      <p>Demo replies, no server</p>
    </div>
  </header>

  <main id="log" aria-live="polite">
    <div class="msg bot">Hi! Type a message below and press Send.</div>
  </main>

  <form id="form" class="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Write a message" aria-label="Message"></textarea>
    <button id="send" type="submit" disabled>Send</button>
  </form>
</div>

<script>
(function () {
  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');

  var replies = [
    'Got it. Tell me more.',
    'That’s interesting. What made you think of it?',
    'Thanks for sharing that.',
    'I see. What would you like to do next?'
  ];
  var n = 0;

  function add(text, who) {
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function resize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    send.disabled = !input.value.trim();
  }

  function submit() {
    var text = input.value.trim();
    if (!text) return;
    add(text, 'me');
    input.value = '';
    resize();

    var t = document.createElement('div');
    t.className = 'msg bot typing';
    t.innerHTML = '<i></i><i></i><i></i>';
    log.appendChild(t);
    log.scrollTop = log.scrollHeight;

    setTimeout(function () {
      t.remove();
      add(replies[n++ % replies.length], 'bot');
    }, 700);
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
  input.addEventListener('input', resize);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });
})();
</script>
</body>
</html>
